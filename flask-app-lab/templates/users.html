{% extends "layout.html" %}
{% block content %}

    <h2>動作、ユーザー確認用管理ページ</h2>

    <table border="1" style="border-collapse: collapse; margin: 0 auto; text-align: center;">
        <tr>
            <th>ユーザー名</th>
            <th>パスワード</th>
            <th>操作</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.password }}</td>
            <td>
                <form action="{{ url_for('delete_user', id=user.user_id) }}" method="POST">
                    <button type="submit">削除</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

{% endblock %}
