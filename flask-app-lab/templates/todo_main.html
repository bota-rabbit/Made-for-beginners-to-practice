{% extends "layout.html" %}
{% block content %}

    <h2>🎀 {{ current_user.username }}さんのやること 🎀</h2>

    <form action="/todo_add" method="POST">
        <input type="text" name="task" placeholder="やることを入力">
        <button type="submit">追加</button>
    </form>

    <ul>
        {% for todo in todos %}
            <li>
                {% if todo.complete %}
                    <s>{{ todo.task }}</s>
                {% else %}
                    {{ todo.task }}
                {% endif %}
                <a href="/todo_complete/{{ todo.id }}">☑</a>
                <a href="/todo_delete/{{ todo.id }}">🗑️</a>
            </li>
        {% endfor %}
    </ul>

    <a href="{{ url_for('menu') }}">🏠 一覧に戻る</a>

{% endblock %}
